<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Teacher</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <h2>Teacher Attendance</h2>
    <p id="status">Loading...</p>
    <button id="in" onclick="act('sign-in')">Sign in</button>
    <button id="out" onclick="act('sign-out')">Sign out</button>
    <button onclick="logout()">Log out</button>
    <p id="msg" style="color: red"></p>
    <script>
      if (!localStorage.token) location.href = "/login.html";
      const logout = () => {
        localStorage.removeItem("token");
        location.href = "/login.html";
      };

      const call = (path, method = "GET") =>
        fetch("/api/sessions" + path, {
          method,
          headers: { Authorization: "Bearer " + localStorage.token },
        }).then(async (r) => ({
          ok: r.ok,
          status: r.status,
          data: await r.json(),
        }));

      async function refresh() {
        const r = await call("/me/status");
        if (r.status === 401 || r.status === 403) return logout();
        const { signedIn, since } = r.data;
        document.getElementById("status").textContent = signedIn
          ? "Signed in since " + new Date(since).toLocaleTimeString()
          : "You are signed out";
        document.getElementById("in").disabled = signedIn;
        document.getElementById("out").disabled = !signedIn;
      }

      async function act(path) {
        const r = await call("/" + path, "POST");
        document.getElementById("msg").textContent = r.ok ? "" : r.data.message;
        refresh();
      }
      refresh();
    </script>
  </body>
</html>
